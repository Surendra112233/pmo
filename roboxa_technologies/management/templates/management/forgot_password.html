{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{% static 'css/forgot.css' %}"> <!-- Link to the new CSS file -->
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Forgot Password</h2>

            <form method="post">
                {% csrf_token %}
                <div class="input-group email-otp-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    <button type="button" id="send-otp">Send OTP</button>
                </div>

                <div class="input-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" name="new_password" placeholder="Enter new password" required>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm new password" required>
                </div>

                <div class="input-group otp-group">
                    <label for="otp">OTP</label>
                    <input type="text" id="otp" name="otp" placeholder="Enter OTP" required>
                    <button type="submit">Submit</button>
                </div>
            </form>

            <!-- <div class="password-change-success">
                <p>Password changed successfully.</p>
            </div> -->

            <div class="back-to-login">
                <a href="{% url 'login' %}">Back to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
