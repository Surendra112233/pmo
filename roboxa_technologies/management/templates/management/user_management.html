<!-- user_management.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <title>User Management</title>
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar">
            <h2>Dashboard Navigation</h2>
            <ul>
                <li>
                    <a href="#" onclick="toggleSubMenu(event, 'user-management-submenu')">User Management</a>
                    <ul id="user-management-submenu" class="submenu">
                        <li><a href="{% url 'add_role' %}">Add Role</a></li>
                        <li><a href="{% url 'maintain_roles' %}">Maintain Roles</a></li>
                    </ul>
                </li>
                <li><a href="{% url 'masterdata' %}">Master Data</a></li>
                <li><a href="{% url 'pmo' %}">PMO</a></li>
                <li><a href="{% url 'employees' %}">Employees</a></li>
                <li><a href="{% url 'manager' %}">Manager</a></li>
            </ul>
        </nav>
        <div class="content">
            <h1>User Management</h1>
        </div>
    </div>

    <script>
        function toggleSubMenu(event, submenuId) {
            event.preventDefault();
            const submenu = document.getElementById(submenuId);
            submenu.style.display = submenu.style.display === 'none' ? 'block' : 'none';
        }

        document.getElementById('user-management-submenu').style.display = 'none';
    </script>
</body>
</html>
