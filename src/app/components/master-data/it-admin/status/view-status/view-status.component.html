<div class="view-status">
  <div class="card">
    <div class="card-header text-white d-flex justify-content-between align-items-center">
      <h4 class="mb-0">View Status</h4>
      <i class="fas fa-pen cursor-pointer"
        data-bs-toggle="tooltip" data-bs-placement="top" title="Edit Status" (click)="onEdit()"></i>
    </div>

    <div class="card-body">
      <!-- Status Code -->
      <div class="form-row">
        <label class="form-label">Status Code</label>
        <div class="form-value">{{ status?.status_code }}</div>
      </div>

      <!-- Status Name -->
      <div class="form-row">
        <label class="form-label">Status Name</label>
        <div class="form-value">{{ status?.status_name }}</div>
      </div>


      <div class="text-center mt-4">
        <button class="btn btn-secondary" (click)="onBack()">Back</button>
      </div>
    </div>
  </div>
</div>
