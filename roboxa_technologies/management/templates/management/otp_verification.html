<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <title>Verify OTP</title>
</head>
<body>
    <div class="background-text">ROBOXA TECHNOLOGIES</div>
    <div class="login-container">
        <div class="login-box">
            <h2>OTP Verification</h2>

           
            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <p class="message {{ message.tags }}">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}

          \
            <form method="POST" action="{% url 'otp_verification' %}">
                {% csrf_token %}
                
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username" value="{{ request.session.username }}" readonly>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" value="{{ request.session.password }}" readonly>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" value="{{ request.session.email }}" readonly>
                </div>

                <div class="input-group">
                    <label for="otp">OTP</label>
                    <input type="text" name="otp" id="otp" placeholder="Enter OTP" required>
                </div>

                <div class="button-container">
                    <button type="button" id="resend-otp">Resend OTP</button>
                    <button type="submit">Submit</button>
                </div>

                <div class="back-button">
                    <a href="{% url 'login' %}">Back</a>
                </div>
            </form>
        </div>
    </div>

    
    <script>
        document.getElementById("resend-otp").addEventListener("click", function() {
            
            window.location.href = "{% url 'send_otp' %}"; 
        });
    </script>
</body>
</html>
