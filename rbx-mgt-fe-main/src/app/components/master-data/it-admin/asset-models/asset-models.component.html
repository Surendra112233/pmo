<div class="main-content asset-models-grid">
    <div class="page-content">
        <div class="container-fluid">
            <p-toast></p-toast>
            <div class="row">
                <div class="col">
                    <div class="h-100">
                        <div class="row row-body" >
                            <div class="col-xl-12">
                                <div class="card">
                                    <div class="card-body">
                                        <div class="table-responsive table-card">
                                            <p-table [value]="assetModels"
                                                [tableStyle]="{ 'min-width': '50rem','width': '100%'}"
                                                [paginator]="assetModels.length > 0"
                                                [rows]="10"
                                                [rowsPerPageOptions]=""
                                                [showCurrentPageReport]="assetModels.length > 0"
                                                currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
                                                #dt2
                                                [globalFilterFields]="['asset_model_code','asset_model_name']">
                                                <ng-template pTemplate="caption">
                                                    <h4 class="card-title mb-0 flex-grow-1 table-title">Asset Models List</h4>
                                                    <div class="add" (click)="addModel()"
                                                          data-bs-toggle="tooltip" data-bs-placement="top" title="Add Model">
                                                        <i class="fas fa-cubes" style="font-size: 16px;"></i>
                                                        <i class="fas fa-plus small"></i>
                                                      </div>
                                                    <div class="search-container">
                                                        <i class="fas fa-search search-icon"></i>
                                                        <input type="text" pInputText (input)="applyFilterGlobal($event, 'contains')" placeholder="Search...">
                                                    </div>
                                                </ng-template>
                                                <ng-template pTemplate="header">
                                                    <tr>
                                                        <th pSortableColumn="asset_model_code">Asset Model Code <p-sortIcon field="asset_model_code" /></th>
                                                        <th pSortableColumn="asset_model_name">Asset Model Name <p-sortIcon field="asset_model_name" /></th>
                                                        <th>Action</th>
                                                    </tr>
                                                </ng-template>
                                                <ng-template pTemplate="body" let-user>
                                                    <tr>
                                                        <td>{{ user.asset_model_code }}</td>
                                                        <td>{{ user.asset_model_name }}</td>
                                                        <td>                                                            
                                                            <i (click)="viewModel(user)" class="action-btn fas fa-eye" data-bs-toggle="tooltip" data-bs-placement="right" title="View"></i>
                                                            <i (click)="editModel(user)" class="action-btn mx-3 fas fa-edit" data-bs-toggle="tooltip" data-bs-placement="right" title="Edit"></i>
                                                            <a (click)="showDeleteDialog(user)"><i class="action-btn fas fa-trash-alt" data-bs-toggle="tooltip" data-bs-placement="right" title="Delete"></i></a>
                                                        </td>
                                                    </tr>
                                                </ng-template>
                                                <ng-template pTemplate="emptymessage">
                                                    <tr>
                                                        <td colspan="6" class="text-center">No data found</td>
                                                    </tr>
                                                </ng-template>
                                            </p-table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<p-dialog header="Delete Asset Model" [(visible)]="displayDeleteDialog" [modal]="true" [closable]="false" [style]="{width: '400px'}">
    <div>
      <span>Are you sure you want to delete this asset model?</span>
    </div>
    <p-footer>
        <div class="col-12 text-center mt-4">
            <a (click)="closeDeleteDialog()" class="btn btn-secondary">Cancel</a>&nbsp;&nbsp;
            <button type="submit" class="btn btn-primary"  (click)="deleteModel()">Confirm</button>
    </div>
    </p-footer>
  </p-dialog>
