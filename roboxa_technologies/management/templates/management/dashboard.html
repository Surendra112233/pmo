<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <title>Dashboard</title>
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar">
            <h2>Dashboard Navigation</h2>
            <ul>
                <li><a href="{% url 'usermanagement' %}" onclick="loadSection('usermanagement')">User Management</a></li>
                <li><a href="{% url 'masterdata' %}" onclick="loadSection('masterdata')">Master Data</a></li>
                <li><a href="{% url 'pmo' %}" onclick="loadSection('pmo')">PMO</a></li>
                <li><a href="{% url 'employees' %}" onclick="loadSection('employees')">Employees</a></li>
                <li><a href="{% url 'manager' %}" onclick="loadSection('manager')">Manager</a></li>
            </ul>
        </nav>
        <div class="content" id="content">
            <h1>Welcome to the Dashboard</h1>
            <p>Select a section from the navigation to get started.</p>
            <!-- Dynamic content will be loaded here -->
        </div>
    </div>

    <script>
        function loadSection(section) {
            let contentDiv = document.getElementById('content');
            if (section === 'usermanagement') {
                contentDiv.innerHTML = `
                    <h1>User Management</h1>
                    <a href="{% url 'add_role' %}" onclick="loadAddRole()">Add New Role</a>
                    <p>Manage users and roles here.</p>
                `;
            } else if (section === 'masterdata') {
                contentDiv.innerHTML = `<h1>Master Data</h1><p>Manage master data here.</p>`;
            } else if (section === 'pmo') {
                contentDiv.innerHTML = `<h1>PMO</h1><p>Manage PMO data here.</p>`;
            } else if (section === 'employees') {
                contentDiv.innerHTML = `<h1>Employees</h1><p>Manage employees here.</p>`;
            } else if (section === 'manager') {
                contentDiv.innerHTML = `<h1>Manager</h1><p>Manage managers here.</p>`;
            }
        }

        function loadAddRole() {
            let contentDiv = document.getElementById('content');
            contentDiv.innerHTML = `
                <h1>Add New Role</h1>
                <form method="POST" action="{% url 'add_role' %}">
                    {% csrf_token %}
                    <label for="role_name">Role Name:</label>
                    <input type="text" id="role_name" name="role_name" required>
                    <button type="submit">Add Role</button>
                </form>
            `;
        }
    </script>
</body>
</html>
